<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="My Portfolio Creatorで作成したキャリアシートのプレビューです。">
  <title>キャリアシート プレビュー</title>
  <link rel="stylesheet" href="css/app-v2.css">
  <link rel="stylesheet" href="css/portfolio-v2.css">
</head>
<body class="preview-page">
  <div class="preview-toolbar no-print" aria-label="プレビュー操作">
    <a class="button" href="editor.html">編集に戻る</a>
    <label class="button file-button" for="preview-load-json">JSONを読み込む</label>
    <input id="preview-load-json" type="file" accept="application/json,.json" hidden>
    <button id="print-portfolio" class="button button-primary" type="button">PDFで保存 / 印刷</button>
  </div>

  <main id="slides-container" class="slides-container" aria-live="polite"></main>
  <div id="notification" class="notification no-print" role="status" aria-live="polite"></div>

  <script src="js/v2/template-loader.js"></script>
  <script src="js/v2/schema.js"></script>
  <script src="js/v2/preview.js"></script>
</body>
</html>
