<div class="slide">
  <div class="title-header">強み・今後の展望</div>
  <div class="content" style="padding:0 30px">
    <div class="section-title">強み</div>
    <div class="strengths-container">{{#each items}}<div class="strength-item"><div class="strength-icon">{{inc @index}}</div><div class="strength-content"><div class="strength-title">{{title}}</div><div class="strength-description">{{description}}</div></div></div>{{/each}}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div class="future-focus"><div class="future-focus-title">今後の注力分野</div><div class="focus-highlights">{{#each focusAreas}}<div class="focus-highlight">{{this}}</div>{{/each}}</div></div>
      <div class="certifications"><div class="certifications-title">保有資格</div><div class="cert-list">{{#each certifications}}<div class="cert-item">{{name}}{{#if acquiredAt}}（{{acquiredAt}}）{{/if}}</div>{{/each}}</div></div>
    </div>
  </div>
</div>
