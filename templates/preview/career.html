<div class="slide">
  <div class="title-header"><div><span class="title-eyebrow">CAREER</span>キャリア年表</div></div>
  <div class="timeline-container">
    <div class="timeline-line"></div>
    <div class="timeline-entries">
      {{#each items}}
      <div class="timeline-entry">
        <div class="timeline-date"><div class="date-period">{{period.from}} — {{displayTo period.to}}</div></div>
        <div class="timeline-content">
          <div class="timeline-heading">
            <div class="timeline-role">{{{emphasis role}}}</div>
            <div class="timeline-company">{{{emphasis company}}}</div>
          </div>
          <div class="timeline-description">{{{emphasis summary}}}</div>
          {{#if highlights.length}}<div class="timeline-highlights">{{#each highlights}}<div class="timeline-highlight">{{{emphasis this}}}</div>{{/each}}</div>{{/if}}
        </div>
      </div>
      {{/each}}
    </div>
  </div>
</div>
