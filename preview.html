<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイポートフォリオプレビュー</title>

  <!-- スタイルシート：共通 -->
  <link rel="stylesheet" href="css/common/base.css">
  <link rel="stylesheet" href="css/common/print.css" media="print">
  <!-- スタイルシート：プレビュー -->
  <link rel="stylesheet" href="css/preview/layout.css?v=2.1.5">
  <link rel="stylesheet" href="css/preview/title.css?v=2.1.3">
  <link rel="stylesheet" href="css/preview/career.css?v=2.1.1">
  <link rel="stylesheet" href="css/preview/skills.css">
  <link rel="stylesheet" href="css/preview/strengths.css">
  <link rel="stylesheet" href="css/preview/technicalcareer/common.css?v=2.1.2">


  <!-- Handlebarsライブラリ -->
  <script src="js/vendor/handlebars.min.js"></script>
</head>

<body>
  <!-- コントロールパネル（印刷時には非表示） -->
  <div id="control-panel" aria-label="プレビュー操作">
    <button id="return-to-editor-btn">エディターに戻る</button>
    <button id="save-pdf-btn">PDFで保存</button>
  </div>

  <!-- 通知表示用の要素 -->
  <div class="notification" id="notification" style="display: none;">
    保存しました！
  </div>

  <!-- レンダリングされたテンプレートを挿入するコンテナ -->
  <div id="slides-container" class="slide-container"></div>

  <!-- スクリプトの読み込み：共通モジュール -->
  <script src="js/common/env-loader.js"></script>
  <script src="js/common/config.js?v=2.1.5"></script>
  <script src="js/common/utils.js"></script>
  <script src="js/common/notification.js"></script>
  <script src="js/common/templates.js"></script>

  <!-- スクリプトの読み込み：プレビューモジュール -->
  <script src="js/editor/ui-controller.js?v=2.1.5"></script>
  <script src="js/preview/renderer.js?v=2.1.2"></script>
  <script src="js/preview/main.js?v=2.1.5"></script>
</body>

</html>
